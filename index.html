<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Security Meta Tags -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="index, follow" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="VouchIt - Share and exchange vouchers with your community. Find great deals and help others save money." />
    <meta name="keywords" content="vouchers, deals, discounts, community, sharing, savings" />
    <meta name="author" content="VouchIt" />
    
    <!-- Viewport and Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VouchIt" />
    
    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:title" content="VouchIt - Share and Exchange Vouchers" />
    <meta property="og:description" content="Share and exchange vouchers with your community. Find great deals and help others save money." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vouchit.vercel.app/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="VouchIt" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VouchIt - Share and Exchange Vouchers" />
    <meta name="twitter:description" content="Share and exchange vouchers with your community. Find great deals and help others save money." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Performance Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Favicon for all browsers -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Apple Touch Icon for iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Favicon for Android -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>VouchIt - Share and Exchange Vouchers</title>
    
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "VouchIt",
      "description": "Share and exchange vouchers with your community",
      "url": "https://vouchit.vercel.app/",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
